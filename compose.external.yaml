services:
  monitoring:
    build:
      context: .
      dockerfile: Dockerfile.external
    restart: unless-stopped
    env_file:
      - .env.external
    environment:
      MONITORING_EXTERNAL: "1"
      LOCAL_DEVELOPMENT: "false"
      UPLOAD_STAGING_DIR: "/app/data/uploads"
    expose:
      - "8000"
    volumes:
      - monitoring-data:/app/data
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_DB: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.external}
    volumes:
      - monitoring-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.external}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.external:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - monitoring

volumes:
  monitoring-data:
  monitoring-db:
  caddy-data:
  caddy-config:
