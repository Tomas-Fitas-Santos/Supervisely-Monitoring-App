# Live-testing infrastructure. Isolated from compose.local.yaml and existing
# local PostgreSQL: do NOT combine these two compose files.
name: nightjar-live

x-backend: &backend
  build:
    context: .
    dockerfile: deploy/Dockerfile.api
    target: base
  env_file:
    - .env.live
  environment:
    APP_ENV: production
    LOCAL_DATA_DIR: /data
    NIGHTJAR_ENCRYPTION_KEY: ${NIGHTJAR_ENCRYPTION_KEY:?Run scripts/init-live-test.ps1 first}
    NIGHTJAR_DEDICATED_INDEXER: "1"
    NIGHTJAR_DEDICATED_MIRROR: "1"
  volumes:
    - type: bind
      source: ${NIGHTJAR_MEDIA_DIR:-./.nightjar-live-data}
      target: /data
    - type: bind
      source: ${NIGHTJAR_DATASET_HOST_DIR:-./.nightjar-source}
      target: /source-datasets
      read_only: true
  restart: unless-stopped

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD}
    volumes:
      - live_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No host port: the database is only accessible inside the stack.

  media-permissions:
    image: alpine:3.21
    restart: "no"
    volumes:
      - type: bind
        source: ${NIGHTJAR_MEDIA_DIR:-./.nightjar-live-data}
        target: /data
    # Linux bind mounts otherwise often default to root-owned mode 0755.
    # Docker Desktop may not support ownership changes on Windows file shares.
    command: ["sh", "-c", "mkdir -p /data && (chown 10001:10001 /data || true)"]

  migrate:
    <<: *backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      media-permissions:
        condition: service_completed_successfully
    command: ["sh", "-c", "alembic upgrade head && python -m annotatiathon.manage sync-organiser-access && python -m annotatiathon.manage backfill-snapshots"]

  indexer:
    <<: *backend
    # Cap heavy local video decoding, leaving host CPU time for remote users.
    cpus: "1.5"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "annotatiathon.mounted_datasets", "--loop", "--poll-seconds", "8"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      indexer:
        condition: service_started
    command: ["uvicorn", "annotatiathon.app:app", "--host", "0.0.0.0",
              "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${NIGHTJAR_LIVE_TEST_PORT:-8080}:80"
    restart: unless-stopped
    # Only this combined web/API origin is reachable from the host/tunnel.

  mirror-worker:
    <<: *backend
    profiles: ["native"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      target: native
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Dedicated, bounded media I/O. Never publishes jobs or polls submissions.
    cpus: "1.0"
    command: ["python", "-m", "annotatiathon.native_worker", "--loop",
              "--role", "mirror", "--poll-seconds", "8"]

  worker:
    <<: *backend
    profiles: ["native"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
      target: native
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "annotatiathon.native_worker", "--loop",
              "--poll-seconds", "12"]
    # Explicitly start AFTER an organiser has verified shared credentials
    # and Team ID/Workspace ID. Not part of default web startup.

volumes:
  live_pg_data:
