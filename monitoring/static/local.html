<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supervisely Monitoring App</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/dashboard.css"><style>body{margin:0;background:#f5f7fa;color:#1f2d3d;font-family:Arial,sans-serif}#startup-error{max-width:800px;margin:30px auto;padding:20px;background:#fff4f4;border:1px solid #ff4949}button,input,select,textarea{font:inherit}*{box-sizing:border-box}</style></head><body><div id="startup-error" hidden></div><div id="app"><nightjar-dashboard :view="view" :form="form" :post="post"></nightjar-dashboard></div><script src="/static/vendor/vue.min.js"></script><script src="/static/connection.js"></script><script src="/static/competition.js"></script><script src="/static/setup.js"></script><script src="/static/dashboard.js"></script><script>
const initial=__INITIAL_DATA__;
// Isolate SDK widget models per local browser tab. Live identity still comes from
// the saved organiser token, never this UI session identifier.
const uiSession=String(crypto.getRandomValues(new Uint32Array(1))[0]);
new Vue({el:'#app',data:{view:initial,form:{}},methods:{async post(route){const headers={'Content-Type':'application/json','x-user-id':uiSession};const response=await fetch(route,{method:'POST',headers,body:JSON.stringify({state:{dashboard:this.form},context:{}})});if(!response.ok)throw new Error('Request failed ('+response.status+').');const result=await response.json();const model=await fetch('/sly/data',{method:'POST',headers,body:'{}'});if(!model.ok)throw new Error('Could not read the current session.');const data=await model.json();Object.assign(this.view,data.dashboard);return result;}}});
