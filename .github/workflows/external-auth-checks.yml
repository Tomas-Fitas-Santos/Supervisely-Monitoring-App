name: External monitor authentication checks
on:
  push:
    branches:
      - feat/video-only-event-ops-20261109
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m compileall -q monitoring
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_external_auth.py tests/test_event_people.py tests/test_event_logistics.py tests/test_zip_dataset.py tests/test_native_member_refresh.py tests/test_role_based_invites.py
      - run: node --check monitoring/static/event_logistics.js
      - run: node --check monitoring/static/event_registrations.js
