name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: monitor_test
          POSTGRES_USER: monitor
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monitor -d monitor_test" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://monitor:test_password@localhost:5432/monitor_test
      - run: node --check monitoring/static/dashboard.js
      - run: node --check monitoring/static/setup.js
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --force-reinstall --no-deps -r requirements-windows.txt
      - name: Verify native Windows dependency and application imports
        run: python -c "import magic; import supervisely; import monitoring.run; print(magic.from_buffer(b'%PDF-1.4 test', mime=True))"
      - run: python -m pytest -q
      - run: node --check monitoring/static/dashboard.js
      - run: node --check monitoring/static/setup.js
