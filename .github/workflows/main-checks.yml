name: Main branch checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-and-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: annotatiathon_test
          POSTGRES_USER: annotatiathon_test
          POSTGRES_PASSWORD: ci_test_password_not_for_production
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U annotatiathon_test -d annotatiathon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://annotatiathon_test:ci_test_password_not_for_production@127.0.0.1:5432/annotatiathon_test
      NIGHTJAR_QUEUE_TEST_URL: postgresql+psycopg://annotatiathon_test:ci_test_password_not_for_production@127.0.0.1:5432/annotatiathon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Lint Python
        run: python -m ruff check src tests migrations
      - name: Apply migrations to real PostgreSQL
        run: alembic upgrade head
      - name: Confirm migration at HEAD
        run: alembic current
      - name: Install FFmpeg for video tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run backend tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Compile frontend
        working-directory: web
        run: npm run build
      - name: Validate Windows deployment scripts syntax
        shell: pwsh
        run: |
          foreach ($path in @('scripts/deploy-live.ps1', 'scripts/init-live-test.ps1', 'scripts/run_worker_sweep.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Out-String | Write-Host
              throw "PowerShell syntax validation failed for $path"
            }
          }

      - name: Prepare disposable live-test container credentials
        run: |
          python - <<'PY'
          import base64
          import secrets
          from pathlib import Path
          source = Path(".env.live.example").read_text()
          source = source.replace("POSTGRES_PASSWORD=GENERATE_WITH_SCRIPT",
                                  "POSTGRES_PASSWORD=" + secrets.token_hex(24))
          source = source.replace("NIGHTJAR_ENCRYPTION_KEY=GENERATE_WITH_SCRIPT",
                                  "NIGHTJAR_ENCRYPTION_KEY=" +
                                  base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())
          Path(".env.live").write_text(source)
          Path(".nightjar-live-data").mkdir(exist_ok=True)
          PY
      - name: Validate live-test Compose configuration
        run: docker compose --env-file .env.live -f compose.live.yaml config --quiet
      - name: Validate private 300-person benchmark configuration
        run: |
          docker compose -f compose.benchmark.yaml config --quiet
          python - <<'PY'
          import json
          import subprocess
          cfg = json.loads(subprocess.check_output([
              "docker", "compose", "-f", "compose.benchmark.yaml",
              "config", "--format", "json",
          ]))
          assert cfg["networks"]["benchmark"]["internal"] is True
          roles = {
              "worker": "publish",
              "status-worker": "status",
              "validation-worker": "validation",
              "correction-worker": "correction",
              "recovery-worker": "recovery",
              "bulk-worker": "bulk",
          }
          for service, role in roles.items():
              command = cfg["services"][service]["command"]
              assert "--role" in command
              assert command[command.index("--role") + 1] == role
              assert not cfg["services"][service].get("ports")
          PY
      - name: Build and start live-test web, API, migration, and database
        run: docker compose --env-file .env.live -f compose.live.yaml up -d --build web
      - name: Verify directly accessible login page and protected API
        run: |
          curl --fail --silent --show-error --retry 15 --retry-delay 3 http://127.0.0.1:8080/health/ready
          curl --fail --silent --show-error http://127.0.0.1:8080/ | grep -qi '<html'
          # A visitor sees Nightjar, but cannot read authenticated staff data.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/auth/me)" = "401"
          # Login and direct roster-only app registration reach FastAPI.
          for path in /api/v1/auth/login /api/v1/auth/register; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{}' "http://127.0.0.1:8080$path")" = "422"
          done
          # Legacy event-roster self-registration is disabled in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"not-registered@example.invalid","password":"VeryStrongExamplePassword2026!"}' http://127.0.0.1:8080/api/v1/auth/register)" = "410"
          # Invalid credentials are rejected by the application as JSON, not by Nginx.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"not-registered@example.invalid","password":"sample-password"}' http://127.0.0.1:8080/api/v1/auth/login)" = "401"
          curl -s -H 'Content-Type: application/json' -d '{"email":"not-registered@example.invalid","password":"sample-password"}' http://127.0.0.1:8080/api/v1/auth/login | grep -q 'Invalid credentials'
          docker compose --env-file .env.live -f compose.live.yaml exec -T api python -c "from pathlib import Path; p=Path('/data/.test-writable'); p.write_text('ok'); p.unlink()"
      - name: Build real Supervisely SDK worker image
        run: docker compose --env-file .env.live -f compose.live.yaml --profile native build worker
      - name: Print container logs when live-test checks fail
        if: failure()
        run: docker compose --env-file .env.live -f compose.live.yaml --profile native logs --tail=80 || true
      - name: Stop disposable live-test containers without deleting volumes
        if: always()
        run: docker compose --env-file .env.live -f compose.live.yaml --profile native down || true
  synthetic-full-lifecycle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      BENCHMARK_PHASE: full
      BENCHMARK_ANNOTATORS: "4"
      BENCHMARK_MONITORS: "2"
      BENCHMARK_FRAMES: "30"
      BENCHMARK_BURST: "1"
      BENCHMARK_INCOMPLETE_RATE: "0.25"
      BENCHMARK_SQL_TIMING: "1"
      BENCHMARK_UPLOAD: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch isolated fake-Supervisely 4-person end-to-end smoke
        run: |
          docker compose -p nightjar-bench-smoke -f compose.benchmark.yaml up -d --build \
            --scale worker=2 --scale validation-worker=2 \
            --scale status-worker=1 --scale correction-worker=1 \
            web worker status-worker validation-worker correction-worker recovery-worker bulk-worker
      - name: Exercise actual upload, SDK mirror, plan, jobs, partial corrections and monitor reviews
        run: |
          docker compose -p nightjar-bench-smoke -f compose.benchmark.yaml run -T --no-deps \
            load python /bench/benchmark_full.py load --seconds 120 --latency 0.02 \
            --assumed-publish-ms 100
          docker compose -p nightjar-bench-smoke -f compose.benchmark.yaml \
            exec -T api /usr/local/bin/nightjar-entrypoint python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/data/results/result.json").read_text())
          flow = result["full_flow"]
          assert flow["source_frames"] == 150, flow
          assert flow["mirrored_frames"] == 150, flow
          assert flow["source_blocks"] == 5, flow
          assert flow["source_blocks_allocated"] == 5, flow
          assert flow["jobs_with_native_bindings"] >= 5, flow
          assert flow["validated_frames"] == 150, flow
          assert flow["reviewed_frames"] > 0, flow
          assert flow["operation_kinds"].get("restart_job:done", 0) >= 1, flow
          assert not result["database"]["operation_errors"], result["database"]
          print("SYNTHETIC_FULL_LIFECYCLE_SMOKE_OK")
          PY
      - name: Print isolated simulator and worker errors
        if: failure()
        run: |
          docker compose -p nightjar-bench-smoke -f compose.benchmark.yaml logs --tail=250 || true
      - name: Remove only the isolated synthetic containers and volumes
        if: always()
        run: docker compose -p nightjar-bench-smoke -f compose.benchmark.yaml down --volumes --remove-orphans || true
