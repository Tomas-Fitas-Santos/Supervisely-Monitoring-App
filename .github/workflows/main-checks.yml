name: Main branch checks
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-and-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: annotatiathon_test
          POSTGRES_USER: annotatiathon_test
          POSTGRES_PASSWORD: ci_test_password_not_for_production
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U annotatiathon_test -d annotatiathon_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: local
      DATABASE_URL: postgresql+psycopg://annotatiathon_test:ci_test_password_not_for_production@127.0.0.1:5432/annotatiathon_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend
        run: python -m pip install -e '.[dev]'
      - name: Lint Python
        run: python -m ruff check src tests migrations
      - name: Apply migrations to real PostgreSQL
        run: alembic upgrade head
      - name: Confirm migration at HEAD
        run: alembic current
      - name: Run backend tests
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Compile frontend
        working-directory: web
        run: npm run build
