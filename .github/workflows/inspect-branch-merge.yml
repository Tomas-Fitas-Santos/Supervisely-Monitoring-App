name: Inspect legacy branch merge conflicts
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/inspect-branch-merge.yml
      - scripts/resolve_pending_merge.py
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect overlap
        shell: bash
        run: |
          git config user.name "Branch merger"
          git config user.email "merge@example.invalid"
          git fetch origin feat/single-team-settings-theme-20261105
          git merge --no-commit --no-ff origin/feat/single-team-settings-theme-20261105 || true
          python3 - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          files = check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          print("UNMERGED FILES:",files)
          for file in files:
              lines = Path(file).read_text().splitlines()
              print("\n##### FILE", file)
              begin = None
              for i, line in enumerate(lines):
                  if line.startswith('<<<<<<<') and begin is None:
                      begin = i
                  if line.startswith('>>>>>>>') and begin is not None:
                      print("\n----- conflict",begin+1,"to",i+1,"-----")
                      print("\n".join(f"{j+1}: {lines[j]}" for j in range(max(0,begin-3),min(len(lines),i+4))))
                      begin=None
          for file, low, high in [('monitoring/static/job_planner.js',55,145), ('monitoring/ui.py',69,149)]:
              print('\n##### FULL REGION',file)
              lines=Path(file).read_text().splitlines()
              print('\n'.join(f'{j+1}: {lines[j]}' for j in range(low-1,min(high,len(lines)))))
          PY
      - name: Resolve conflicts using checked script
        run: |
          python3 scripts/resolve_pending_merge.py
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          node --check monitoring/static/attendance.js
          node --check monitoring/static/dashboard.js
          node --check monitoring/static/job_planner.js
          node --check monitoring/static/structured_dataset.js
      - name: Run focused merged tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q tests/test_external_auth.py tests/test_event_people.py tests/test_event_logistics.py tests/test_zip_dataset.py tests/test_auth.py tests/test_launch.py
